<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إدارة الكرنه</title><link rel="stylesheet" href="/landing.css"></head><body><main><h1>إدارة الكرنه</h1><p>حساب الإدارة مستقل عن مستخدمي المحل. كل تعديل حساس يحتاج سببًا ويُسجّل للتدقيق.</p><section id="login"><form id="admin-login"><label>اسم المستخدم<input name="username" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><label>رمز المصادقة الثنائية<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button>دخول الإدارة</button></form></section><p id="message" role="status"></p><section id="workspace" hidden><button id="logout">خروج</button><label>بحث في السجلات<input id="search" type="search"></label><div id="actions"></div><div id="records"></div></section></main><script type="module" src="/admin/admin.js"></script></body></html>
