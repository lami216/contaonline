name: contaonline checks
on:
  push:
    branches: ['feat/**', 'fix/**', 'main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contaonline-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node -e "const fs=require('node:fs'),pw=require('playwright');for(const name of ['chromium','webkit'])if(!fs.existsSync(pw[name].executablePath()))throw Error('Missing pinned browser '+name)"
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          BROWSER_ENGINE: webkit
      - run: npm audit --audit-level=high
