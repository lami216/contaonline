name: contaonline checks
on:
  push:
    branches: ['feat/**', 'fix/**', 'main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contaonline-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright install --with-deps chromium webkit
        timeout-minutes: 6
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          BROWSER_ENGINE: webkit
      - run: npm audit --audit-level=high
